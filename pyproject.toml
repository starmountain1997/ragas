[project]
name = "ragas"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "agno>=3.2.1",
    "numpy>=2.5.5",
    "openai>=3.59.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
extend-select = [
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # simplify
    "PT",    # pytest 风格
    "RUF",   # ruff 自有规则
]
ignore = [
    "E501",  # 超长行：违规全在 docstring/URL 内，formatter 管不到
    "RUF001", "RUF002", "RUF003",  # 中文注释「歧义字符」——纯误报
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001"]
