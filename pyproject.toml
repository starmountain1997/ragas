[project]
name = "ragas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agno>=3.2.1",
    "numpy>=2.5.5",
    "openai>=3.59.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "ty>=0.0.111",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # simplify
    "PT",    # pytest 风格
    "RUF",   # ruff 自有规则
]
ignore = [
    "E501",  # 超长行：违规全在 docstring/URL 内，formatter 管不到
    "RUF001", "RUF002", "RUF003",  # 中文注释「歧义字符」——纯误报
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001"]

[tool.ty.src]
include = ["src", "tests"]

[tool.importlinter]
root_packages = ["ragas"]

[[tool.importlinter.contracts]]
name = "evaluation → metrics → llm/embeddings → schema 分层"
type = "layers"
# import-linter 约定：列表前面的层更高（可 import 后面的层，反向禁止）
layers = [
    "ragas.evaluation",
    "ragas.metrics",
    "ragas.llm | ragas.embeddings",
    "ragas.schema",
]
